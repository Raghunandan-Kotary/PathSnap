# HMM/Viterbi decoder weights (Person 3), chosen by hmm/tune_decoder.py on the 80 training
# trips with out-of-fold probabilities. See hmm/tuning/best_params.json and grid_search.csv.
disconnect_penalty: 25.0
gap_threshold_s: 30.0
dijkstra_cutoff_m: 1000.0
backtrack_tolerance_m: 25.0
emission_blend: log_linear
emission_weight: 0.35
distance_scale_m: 5.5
transition_scale_m: 10.0
